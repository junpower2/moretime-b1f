<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============================================================
// 寸法（メートル）。原点＝鏡の面と階段側の壁が交わる床の角
//   x：鏡（0）→ 駐車場側の壁（W） ／ z：階段側の壁（0）→ ロッカー側の壁（D） ／ y：高さ
// 実施図面（ChronoBa A-02-00）の寸法から換算
// ============================================================
const W = 6.23, D = 5.89, H = 2.651;
const ARC = { cx: W, cz: 5.19, r: 2.0 };     // 曲面のステンレス壁（R2000）

// ---------- 乱数（毎回同じ模様になるよう種を固定） ----------
let _s = 20261112;
const rnd = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();

// ---------- 質感の画像をその場で描く ----------
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
// ぼんやりしたムラ（大きさの違う乱数の重ね合わせ）
function mottle(g, w, h, octaves, alpha, dark = '0,0,0', light = '255,255,255') {
  for (const n of octaves) {
    const [c, x] = canvas(n, Math.max(2, Math.round(n * h / w)));
    const im = x.createImageData(c.width, c.height);
    for (let i = 0; i < im.data.length; i += 4) { const v = rnd(); const col = (v < .5 ? dark : light).split(','); im.data[i] = +col[0]; im.data[i+1] = +col[1]; im.data[i+2] = +col[2]; im.data[i+3] = Math.abs(v - .5) * 2 * 255 * alpha; }
    x.putImageData(im, 0, 0);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(c, 0, 0, w, h);
  }
}
function grain(g, w, h, amount) {
  const im = g.getImageData(0, 0, w, h);
  for (let i = 0; i < im.data.length; i += 4) { const d = (rnd() - .5) * amount; im.data[i] += d; im.data[i+1] += d; im.data[i+2] += d; }
  g.putImageData(im, 0, 0);
}
function tex(c, rx = 1, ry = 1, srgb = true) {
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
// 白く塗った荒いコンクリート壁（型枠の継ぎ目・セパ穴・欠け・擦り傷）。1枚＝3m角
function wallCanvas() {
  const S = 1024, [c, g] = canvas(S, S), m = S / 3;
  g.fillStyle = '#ecebe6'; g.fillRect(0, 0, S, S);
  mottle(g, S, S, [5, 11, 23, 47], .08, '120,120,112', '255,255,252');
  // 欠け・剥がれ
  for (let i = 0; i < 45; i++) {
    const x = rr(0, S), y = rr(0, S), r = rr(3, 13);
    g.fillStyle = `rgba(${rr(150,185)|0},${rr(148,180)|0},${rr(135,165)|0},${rr(.12,.32)})`;
    g.beginPath(); for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2, q = r * rr(.5, 1.15); g.lineTo(x + Math.cos(a) * q * 1.6, y + Math.sin(a) * q * .7); } g.fill();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; g.stroke();
  }
  // 型枠の継ぎ目（横0.45m・縦0.9m）
  g.lineCap = 'round';
  for (let y = 0; y < S; y += m * .45) for (let x = 0; x < S; x += 24) {
    g.strokeStyle = `rgba(95,92,80,${rr(.12,.4)})`; g.lineWidth = rr(.8, 2.2);
    g.beginPath(); g.moveTo(x, y + rr(-1.5, 1.5)); g.lineTo(x + 24, y + rr(-1.5, 1.5)); g.stroke();
  }
  for (let row = 0; row < 7; row++) for (let x = (row % 2) * m * .45; x < S; x += m * .9) {
    g.strokeStyle = `rgba(95,92,80,${rr(.15,.35)})`; g.lineWidth = rr(.8, 1.8);
    g.beginPath(); g.moveTo(x + rr(-1, 1), row * m * .45); g.lineTo(x + rr(-1, 1), (row + 1) * m * .45); g.stroke();
  }
  // セパ穴
  for (let y = m * .22; y < S; y += m * .45) for (let x = m * .2; x < S; x += m * .6) {
    g.fillStyle = 'rgba(70,68,60,.55)'; g.beginPath(); g.arc(x + rr(-6, 6), y + rr(-4, 4), rr(2.5, 4.5), 0, 7); g.fill();
  }
  // 擦り傷
  for (let i = 0; i < 260; i++) {
    const x = rr(0, S), y = rr(0, S), a = rr(0, Math.PI), l = rr(6, 46);
    g.strokeStyle = rnd() < .6 ? `rgba(110,106,92,${rr(.15,.45)})` : 'rgba(255,255,255,.5)'; g.lineWidth = rr(.6, 1.8);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + rr(-6, 6), y + Math.sin(a) * l * .5 + rr(-6, 6), x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  grain(g, S, S, 14);
  return c;
}
// 床：モルタル薄塗り＋防塵クリア。1枚＝4m角
function floorCanvas() {
  const S = 1024, [c, g] = canvas(S, S);
  g.fillStyle = '#cfcfca'; g.fillRect(0, 0, S, S);
  mottle(g, S, S, [3, 6, 13, 29, 61], .12, '110,108,100', '250,250,246');
  for (let i = 0; i < 26; i++) { const x = rr(0, S), y = rr(0, S), r = rr(30, 120); const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${rnd() < .5 ? '120,112,98' : '240,240,236'},${rr(.05,.14)})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  for (let i = 0; i < 18; i++) { let x = rr(0, S), y = rr(0, S); g.strokeStyle = 'rgba(90,88,82,.22)'; g.lineWidth = .8; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 9; k++) { x += rr(-22, 22); y += rr(-22, 22); g.lineTo(x, y); } g.stroke(); }
  grain(g, S, S, 10);
  return c;
}
// 天井：コンクリート打放しのスラブ（板目の型枠跡）。1枚＝3m角
function slabCanvas() {
  const S = 1024, [c, g] = canvas(S, S);
  g.fillStyle = '#807e7a'; g.fillRect(0, 0, S, S);
  mottle(g, S, S, [4, 9, 21, 45], .16, '58,56,52', '176,174,168');
  for (let x = 0; x < S; x += S / 20) { g.fillStyle = `rgba(${rnd() < .5 ? '40,38,35' : '190,188,182'},${rr(.03,.10)})`; g.fillRect(x, 0, S / 20, S); g.fillStyle = 'rgba(40,36,30,.35)'; g.fillRect(x, 0, 1.4, S); }
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(50,45,38,${rr(.05,.2)})`; g.fillRect(rr(0, S), rr(0, S), rr(1, 3), rr(10, 90)); }
  grain(g, S, S, 16);
  return c;
}
// 木目（天然木の明るめの天板）
function woodCanvas(base = '#7c4a30', dark = '46,24,13') {
  const [c, g] = canvas(1024, 512);
  g.fillStyle = base; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 9; i++) { g.fillStyle = `rgba(${rnd() < .5 ? dark : '168,108,74'},${rr(.05,.14)})`; g.fillRect(0, i * 57, 1024, 57); g.fillStyle = `rgba(${dark},.25)`; g.fillRect(0, i * 57, 1024, 1); }
  for (let i = 0; i < 520; i++) {
    let y = rr(0, 512); const x0 = rr(-200, 1024), l = rr(120, 700);
    g.strokeStyle = `rgba(${dark},${rr(.04,.2)})`; g.lineWidth = rr(.5, 1.6);
    g.beginPath(); g.moveTo(x0, y); for (let x = x0; x < x0 + l; x += 40) { y += rr(-1.6, 1.6); g.lineTo(x, y); } g.stroke();
  }
  grain(g, 1024, 512, 8);
  return c;
}
// ステンレス（バイブレーション仕上げ）
function susCanvas() {
  const S = 512, [c, g] = canvas(S, S);
  g.fillStyle = '#c6c9ca'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 5000; i++) { const x = rr(0, S), y = rr(0, S), a = rr(0, 7), r = rr(3, 9); g.strokeStyle = `rgba(${rnd() < .5 ? '255,255,255' : '90,92,92'},${rr(.05,.16)})`; g.lineWidth = .6; g.beginPath(); g.arc(x, y, r, a, a + rr(.6, 2)); g.stroke(); }
  return c;
}
// 25mm角の白モザイクタイル（1枚＝0.2m角）
function mosaicCanvas() {
  const S = 256, [c, g] = canvas(S, S), n = 8, p = S / n;
  g.fillStyle = '#d9d8d2'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const v = rr(236, 247) | 0; g.fillStyle = `rgb(${v},${v},${v - 3})`; g.fillRect(i * p + 1.5, j * p + 1.5, p - 3, p - 3); }
  return c;
}
// ガラスブロック越しの外光
function glassBlockCanvas() {
  const [c, g] = canvas(256, 128);
  g.fillStyle = '#9db6c9'; g.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++) { const gr = g.createRadialGradient(i * 32 + 16, j * 32 + 16, 2, i * 32 + 16, j * 32 + 16, 22); gr.addColorStop(0, `rgba(235,245,255,${rr(.6,.95)})`); gr.addColorStop(1, 'rgba(110,150,185,.9)'); g.fillStyle = gr; g.fillRect(i * 32 + 2, j * 32 + 2, 28, 28); }
  return c;
}
// 監視カメラのモニター画面
function monitorCanvas(k) {
  const [c, g] = canvas(512, 288); g.fillStyle = '#0c0e10'; g.fillRect(0, 0, 512, 288);
  const names = [['1F エントランス', '1F キッズ', '2F サロン', '3F トリミング'], ['B1 駐車場', '階段', '3F ホテル', '外観'], ['予約', 'シフト', 'タスク', '入退室']][k];
  for (let i = 0; i < 4; i++) {
    const x = (i % 2) * 256 + 4, y = (i >> 1) * 144 + 4;
    const gr = g.createLinearGradient(x, y, x + 248, y + 136); gr.addColorStop(0, `hsl(${k === 2 ? 150 : 210 + i * 12},${k === 2 ? 12 : 16}%,${rr(26,40)}%)`); gr.addColorStop(1, `hsl(${30 + i * 8},14%,${rr(44,60)}%)`);
    g.fillStyle = gr; g.fillRect(x, y, 248, 136);
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x, y + 86, 248, 50);
    g.fillStyle = 'rgba(255,255,255,.14)'; for (let q = 0; q < 4; q++) g.fillRect(x + rr(10, 190), y + rr(30, 90), rr(20, 60), rr(14, 44));
    g.fillStyle = '#fff'; g.font = '13px sans-serif'; g.fillText(names[i], x + 8, y + 18);
    g.fillStyle = '#ff5a4d'; g.beginPath(); g.arc(x + 236, y + 13, 4, 0, 7); g.fill();
  }
  return c;
}
function shadowBlob() {
  const [c, g] = canvas(128, 128); const gr = g.createRadialGradient(64, 64, 6, 64, 64, 62);
  gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(.6, 'rgba(0,0,0,.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return c;
}

// ---------- 素材 ----------
const mats = [];
const std = o => { const m = new THREE.MeshStandardMaterial(o); mats.push(m); return m; };
const wallC = wallCanvas(), woodC = woodCanvas(), lockC = woodCanvas('#c9aa80', '120,84,48');
const tWall = tex(wallC, 1, 1), tWallB = tex(wallC, 1, 1, false);
const mWall = std({ map: tWall, bumpMap: tWallB, bumpScale: 2.2, roughness: .93 });
const mPaint = std({ map: tWall, bumpMap: tWallB, bumpScale: 2.2, roughness: .93 });   // 柱・梁
const mFloor = std({ map: tex(floorCanvas(), W / 4, D / 4), roughness: .5, metalness: 0 });
const mSlab = std({ map: tex(slabCanvas(), W / 3, D / 3), roughness: .95 });
const mWhite = std({ color: '#efeeea', roughness: .7 });
const mWhiteGloss = std({ color: '#f4f4f2', roughness: .28 });
const mWoodTop = std({ map: tex(woodC, 1, 1), roughness: .42 });   // ウレタン塗装のつや
const mLock = (() => { const t = tex(lockC, .5, 1); t.rotation = Math.PI / 2; t.center.set(.5, .5); return std({ map: t, roughness: .6 }); })();
const mLockDoor = std({ color: '#f1f0ec', roughness: .42, metalness: .1 });
const mBlack = std({ color: '#141414', roughness: .45, metalness: .3 });
const mBlackSoft = std({ color: '#1a1a1b', roughness: .62 });
const mMesh = std({ color: '#26282a', roughness: .85, transparent: true, opacity: .86 });
const mAlu = std({ color: '#c9cbcc', roughness: .28, metalness: 1 });
const mSus = std({ map: tex(susCanvas(), 3, 2), roughness: .3, metalness: 1 });
const mChrome = std({ color: '#d8d8d8', roughness: .12, metalness: 1 });
const mBronze = std({ color: '#2b2622', roughness: .5, metalness: .6 });
const mGlass = std({ color: '#cfe0e6', roughness: .05, metalness: 0, transparent: true, opacity: .22 });
const mFabric = std({ color: '#d9d0c0', roughness: .95 });
const mBench = std({ color: '#b9b2a4', roughness: .95 });
const mOak = std({ color: '#75462d', roughness: .55 });
const mLeaf = std({ color: '#3f6b3a', roughness: .7, side: THREE.DoubleSide });
const mSoil = std({ color: '#3a2f26', roughness: 1 });
const mMosaic = std({ map: tex(mosaicCanvas(), 1, 1), roughness: .35 });
const mLampOn = new THREE.MeshBasicMaterial({ color: '#fff7ea' });
const mScreen = std({ color: '#f6f6f4', roughness: .9 });

// ---------- シーン ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 760;   // スマホでは軽くする
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .92;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#141516');
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, .05, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.minDistance = .2; controls.maxDistance = 22;

const room = new THREE.Group(); scene.add(room);
const ceiling = new THREE.Group(); room.add(ceiling);     // 俯瞰のとき隠す
const tags = [];                                           // 備品名の札
const add = (m, p = room) => { p.add(m); return m; };
const sh = (m, cast = true, recv = true) => { m.traverse(o => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = recv; } }); return m; };

// 直方体（x0〜x1, y0〜y1, z0〜z1 で指定）
function box(x0, x1, y0, y1, z0, z1, mat, p = room, r = 0) {
  const g = r ? new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 3, r) : new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  if (mat === mPaint) {   // 模様が伸びないよう、面ごとに実寸（3mで1枚）で貼る
    const w = x1 - x0, h = y1 - y0, d = z1 - z0, uv = g.attributes.uv, o = rnd();
    [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]].forEach(([a, b], f) => { for (let i = f * 4; i < f * 4 + 4; i++) uv.setXY(i, o + uv.getX(i) * a / 3, o + uv.getY(i) * b / 3); });
  }
  const m = new THREE.Mesh(g, mat); m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.castShadow = m.receiveShadow = true; return add(m, p);
}
// 中心と大きさで指定する直方体（家具の部品用）
function part(p, w, h, d, mat, x, y, z, r = 0) {
  const m = new THREE.Mesh(r ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; p.add(m); return m;
}
function cyl(p, r, h, mat, x, y, z, seg = 24, r2 = r) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r2, r, h, seg), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; p.add(m); return m;
}
// 壁の面（A→B に進むとき、面は右手側＝室内を向く）。模様がつながるよう通し寸法 s0 を渡す
function wallQuad(ax, az, bx, bz, y0, y1, s0 = 0, mat = mWall, p = room) {
  const len = Math.hypot(bx - ax, bz - az), g = new THREE.PlaneGeometry(len, y1 - y0), uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (s0 + uv.getX(i) * len) / 3, (y0 + uv.getY(i) * (y1 - y0)) / 3);
  const m = new THREE.Mesh(g, mat); m.position.set((ax + bx) / 2, (y0 + y1) / 2, (az + bz) / 2); m.rotation.y = Math.atan2(-(bz - az), bx - ax);
  m.receiveShadow = true; return add(m, p);
}
